# 生产环境配置（也兼容开发环境基础需求）
# 开发时暴露额外端口用 docker-compose.override.yml（自动加载）
# 生产部署时只用本文件，端口仅对内暴露由 nginx 反代

services:
  postgres:
    image: postgres:16-alpine
    container_name: mahiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 生产不对外暴露 5432，仅在容器网络内可达
    # 如需本机调试，临时加端口映射或用 ssh 隧道
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend-go:
    build: ./backend-go
    container_name: mahiro-backend-go
    restart: unless-stopped
    environment:
      HTTP_PORT: ${HTTP_PORT}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GO_API_SHARED_SECRET: ${GO_API_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # uploads 目录：Go 后端需要读写用户上传的文件
      # 注意：路径和 nginx alias 指向的宿主机路径一致，保证写入后 nginx 立即可读
      UPLOADS_DIR: /app/uploads
    # 绑定到 127.0.0.1，仅宿主机 nginx 可访问，不对外暴露
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./data:/data:ro
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  next-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahiro-next-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GO_API_INTERNAL_URL: ${GO_API_INTERNAL_URL}
      GO_API_SHARED_SECRET: ${GO_API_SHARED_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
    # 绑定到 127.0.0.1，仅宿主机 nginx 可访问，不对外暴露
    ports:
      - '127.0.0.1:3000:3000'
    # 挂载 uploads 和 data 目录
    # uploads: getPublicMidis 读取 MIDI 文件解析时长；其他 CRUD 已迁到 Go
    # data: 大部分 JSON 已迁到 Go，只读即可；conversations 需动态写入单独挂载
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data:ro
      # analytics 目录：目前在next端读取，后续可迁移到go
      - ./data/analytics:/app/data/analytics
      # conversations 目录：目前在next端读取，后续可迁移到go
      - ./data/conversations:/app/data/conversations
    depends_on:
      - backend-go
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
